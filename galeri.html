<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Sore - Galeri</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Galeri Cafe Sore</h1>
        <p>Intip proses di balik layar dan kenalan dengan barista kami.</p>
        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="tentang.html">Tentang Kami</a></li>
                <li><a href="produk.html">Katalog Produk</a></li>
                <li><a href="galeri.html">Galeri</a></li>
                <li><a href="kontak.html">Kontak</a></li>

    <main>
        
        <section id="galeri-foto">
            <h2>Foto dan Momen</h2>
            <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                <figure style="margin: 0;">
                    
                    <img src="assets/images/proses.jpg" alt="Mesin espresso sedang menyeduh kopi" style="width: 300px; height: 300px; object-fit: cover; border-radius: 8px;">
                    <figcaption style="text-align: center; margin-top: 10px;">Proses ekstraksi espresso yang presisi</figcaption>
                </figure>
                <figure style="margin: 0;">
                   
                    <img src="assets/images/tim.jpg" alt="Barista Cafe Sore tersenyum melayani pelanggan" style="width: 300px; height: 300px; object-fit: cover; border-radius: 8px;">
                    <figcaption style="text-align: center; margin-top: 10px;">Sapaan hangat dari barista kami</figcaption>
                </figure>
            </div>
        </section>

        
        <section id="audio-sapaan" style="margin-top: 40px;">
            <h2>Dengarkan Sapaan Barista</h2>
            <audio controls>
                <source src="assets/audio/cerita-umkm.mp3" type="audio/mpeg">
                Browser Anda tidak mendukung elemen audio.
            </audio>
        </section>
    </main>

    <footer>
